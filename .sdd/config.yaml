version: 1
base_branch: main
packages:
  - path: .
    commands:
      test: npm test
      test_single: "node --test"
      lint: "node plugins/sdd/scripts/sdd.mjs validate --all"
      format: ""
      build: ""
testing: { tdd: strict, doubles: explicit }
git: { integration: merge }
commit: { format: conventional }
pr: { draft: true, auto_ready: false, forge: github }
gates: { enforce: true, exempt: [] }
routes: { quick_max_files: 5 }
release: { branch: main }
autopilot: { enabled: false }
integrations: {}
paths: { constitution: docs/constitution.md }
